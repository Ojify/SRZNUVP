{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Сервис заявок{% endblock %}</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="{% static 'homepage/css/style.css' %}">
</head>
<body>
    <header class="d-flex align-items-center px-3 py-2 bg-white border-bottom">
        <a href="{% url 'homepage:index' %}"
           class="d-flex align-items-center text-decoration-none me-4">
            <img src="{% static 'homepage/img/logo.png' %}"
                 alt="Сервис заявок"
                 class="site-logo">
            <strong>Сервис заявок</strong>
        </a>
        {% include "includes/navigation.html" %}
    </header>

    <main class="container mt-3">
        {% block content %}{% endblock %}
    </main>

    <footer class="container mt-4 mb-3">
        <p>© <span id="current-year"></span> Сервис заявок</p>
    </footer>

    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
